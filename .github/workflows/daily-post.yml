# .github/workflows/daily-post.yml
name: Daily Cute Animal Post

on:
  schedule:
    # 10 AM Singapore time = 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # allows manual trigger

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # updated

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily post script
        env:
          IG_USER: ${{ secrets.IG_USER }}
          IG_PASS: ${{ secrets.IG_PASS }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
          # Uncomment if you add TikTok support
          # TIKTOK_TOKEN: ${{ secrets.TIKTOK_TOKEN }}
        run: python post_animals.py
