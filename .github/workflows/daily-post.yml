name: Daily Cute Animal Post

on:
  schedule:
    - cron: '0 2 * * *'   # 10 AM Singapore = 2 AM UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily post script
        env:
          IG_USER: ${{ secrets.IG_USER }}
          IG_PASS: ${{ secrets.IG_PASS }}
          IG_PROXY: ${{ secrets.IG_PROXY }}   # new proxy secret
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python -u post_animals.py

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: animal-post-logs
          path: logs/

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: animal-post-image
          path: "*.jpg"
